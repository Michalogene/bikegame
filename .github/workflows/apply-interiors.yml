name: apply-interiors-checkpoint

# The staging commit installs this workflow; this follow-up revision triggers it.
on:
  push:
    branches:
      - chatgpt/afterdark-county
    paths:
      - 'bootstrap/interiors.patch.gz.b64'
      - '.github/workflows/apply-interiors.yml'

permissions:
  contents: write

concurrency:
  group: apply-afterdark-interiors
  cancel-in-progress: false

jobs:
  apply-test-and-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/afterdark-county
          fetch-depth: 0

      - name: Decode and apply interiors patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode bootstrap/interiors.patch.gz.b64 | gzip -d > /tmp/interiors.patch
          echo "7639cb2074693629e40af48dbcd179bb6eb44aa022526879dfd05aa0a4332034  /tmp/interiors.patch" | sha256sum --check -
          git apply --check /tmp/interiors.patch
          git apply /tmp/interiors.patch

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund

      - name: Verify interiors checkpoint
        run: npm run verify

      - name: Run Chromium gameplay smoke
        run: npm run smoke
        env:
          CHROME_BIN: google-chrome

      - name: Commit verified interiors
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-interiors.yml bootstrap/interiors.patch.gz.b64
          git add src/app/GameApp.js src/render/CameraRig.js src/world/InteriorSystem.js src/world/WorldBuilder.js src/world/WorldFactories.js src/world/WorldPolish.js tests/interiors.test.js
          git diff --cached --check
          git commit -m "feat: add playable building interiors"
          git push origin HEAD:chatgpt/afterdark-county
