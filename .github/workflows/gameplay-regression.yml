name: gameplay-regression

on:
  push:
    branches:
      - chatgpt/afterdark-county
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'styles/**'
      - 'bootstrap/wip-respawn-camera-interiors.patch.gz.b64'
      - '.github/workflows/gameplay-regression.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
  pull_request:

permissions:
  contents: read

concurrency:
  group: afterdark-gameplay-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gameplay-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/afterdark-county
          fetch-depth: 0

      - name: Apply preserved WIP when it has not been checkpointed yet
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f bootstrap/wip-respawn-camera-interiors.patch.gz.b64 ]]; then
            base64 --decode bootstrap/wip-respawn-camera-interiors.patch.gz.b64 | gzip -d > /tmp/afterdark-wip.patch
            git apply --check /tmp/afterdark-wip.patch
            git apply /tmp/afterdark-wip.patch
            git diff --check
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund

      - name: Lint, typecheck, unit tests and production build
        run: npm run verify

      - name: Existing Pine Ridge smoke proof
        run: npm run smoke
        env:
          CHROME_BIN: google-chrome

      - name: Respawn, movement, time and interior Chromium proof
        run: node scripts/gameplay-regression-smoke.mjs
        env:
          CHROME_BIN: google-chrome

      - name: Upload gameplay proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afterdark-gameplay-regression
          path: |
            reports
            dist
          if-no-files-found: warn
          retention-days: 14
