name: bootstrap-afterdark-source

on:
  push:
    branches:
      - chatgpt/afterdark-county
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap-afterdark.yml'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap-afterdark.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-afterdark-source
  cancel-in-progress: false

jobs:
  unpack-verify-and-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/afterdark-county
          fetch-depth: 0

      - name: Reconstruct verified source tree
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/afterdark-source.part* > /tmp/afterdark-source.tar.gz.b64
          base64 --decode /tmp/afterdark-source.tar.gz.b64 > /tmp/afterdark-source.tar.gz
          echo "dc3b65a73d29acef07e170e5f945069980fe4238c13187b627c8677d4d027773  /tmp/afterdark-source.tar.gz" | sha256sum --check -
          tar -xzf /tmp/afterdark-source.tar.gz
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-afterdark.yml

      - name: Commit reconstructed playable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: build playable Pine Ridge survival foundation"
          git push origin HEAD:chatgpt/afterdark-county

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund

      - name: Verify source, tests, and production build
        run: npm run verify

      - name: Run Chromium gameplay smoke test
        run: npm run smoke
        env:
          CHROME_BIN: google-chrome

      - name: Upload playable proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afterdark-county-bootstrap-verification
          path: |
            dist
            reports
          if-no-files-found: warn
          retention-days: 7
