name: apply-visual-pass

on:
  push:
    branches:
      - chatgpt/afterdark-county
    paths:
      - 'bootstrap/visual-pass.patch.gz.b64'
      - '.github/workflows/apply-visual-pass.yml'

permissions:
  contents: write

concurrency:
  group: apply-afterdark-visual-pass
  cancel-in-progress: false

jobs:
  apply-test-and-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/afterdark-county
          fetch-depth: 0

      - name: Decode and verify visual patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode bootstrap/visual-pass.patch.gz.b64 | gzip -d > /tmp/visual-pass.patch
          echo "b7bab34e002e55f6995c5d3f873b145ac18343f545811c3030aec7907fba46c8  /tmp/visual-pass.patch" | sha256sum --check -
          git apply --check /tmp/visual-pass.patch
          git apply /tmp/visual-pass.patch

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund

      - name: Verify visual pass
        run: npm run verify

      - name: Run Chromium gameplay smoke proof
        run: npm run smoke
        env:
          CHROME_BIN: google-chrome

      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afterdark-county-visual-pass
          path: reports
          if-no-files-found: warn
          retention-days: 7

      - name: Commit visual pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/render/CameraRig.js src/render/Renderer.js src/world/WorldFactories.js styles/main.css
          git diff --cached --check
          git commit -m "visual: improve Pine Ridge composition and night readability"
          git push origin HEAD:chatgpt/afterdark-county
